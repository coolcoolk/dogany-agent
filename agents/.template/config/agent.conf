# agent.conf — non-secret agent configuration (portable, distributable).
# Secrets (bot token, chat id, API tokens) live in .telegram_bot/.env, NOT here.
#
# AGENT_LANG selects the i18n locale under config/i18n/<lang>.json.
# Supported out of the box: en, ko. Add more by dropping a new <lang>.json.
AGENT_LANG=en

# Health-observer machine warnings (DGN-1713). Only the crew representative
# (DOGANY_AGENT_CLASS=main) evaluates these; the shared host state dedupes all
# instances. Empty/missing values use the defaults below. Alerts are routed to
# that agent's session inbox for its own owner-facing wording, never a cleanup.
# A breach alerts once; while it lasts it re-alerts only when the reading
# worsens by a step since the last alert, or after the reminder interval
# (DGN-1773). Recovery ends the episode only at threshold minus the clear
# margin or lower (disk 85 -> 83, swap 4096 -> 3584 MB, load 1.5 -> 1.25 x
# ncpu); a re-breach within the re-arm window after recovery continues
# the same episode silently, a later one alerts again (DGN-1879).
# On/off switch (DGN-1911): off silences machine alerts (thresholds stay as
# they are -- never raise a threshold to mute). OFF_UNTIL (ISO date or local
# datetime) makes it a time-boxed off. Set it with
# `routines/health-observer.py --machine-alerts on|off [--until WHEN]`.
# HEALTH_OBSERVER_MACHINE_ALERTS=on
# HEALTH_OBSERVER_MACHINE_ALERTS_OFF_UNTIL=
# HEALTH_OBSERVER_SWAP_WARN_MB=4096
# HEALTH_OBSERVER_LOAD_WARN_MULTIPLIER=1.5
# HEALTH_OBSERVER_LOAD_WARN_SECONDS=900
# HEALTH_OBSERVER_DISK_WARN_PCT=85
# HEALTH_OBSERVER_DISK_STEP_PCT=2
# HEALTH_OBSERVER_SWAP_STEP_MB=1024
# HEALTH_OBSERVER_MACHINE_REMIND_SECONDS=86400
# HEALTH_OBSERVER_DISK_CLEAR_MARGIN_PCT=2
# HEALTH_OBSERVER_SWAP_CLEAR_MARGIN_MB=512
# HEALTH_OBSERVER_LOAD_CLEAR_MARGIN=0.25
# HEALTH_OBSERVER_MACHINE_REARM_SECONDS=21600

# Card/visual accent (DGN-768). A palette name from design_tokens
# ACCENT_PALETTE (teal aqua sky cobalt indigo violet orchid magenta rose coral
# amber lime emerald pink peri). Empty = unassigned. Resolution: this user
# override > crew accent (leader, needs AGENT_CREW=lifekit|devkit) > kit
# domain accent (AGENT_KIT_ACCENT, same names) > system teal. Unknown names
# fall through; cards never fail on a bad value.
AGENT_ACCENT=
# AGENT_CREW=
# AGENT_KIT_ACCENT=

# Optional: overrides how the assistant addresses the user, without editing
# locale files. DGN-1196: do NOT reintroduce a hyphenated English noun here --
# it sits in the model's context next to the Korean value and leaks a hybrid.
# If empty, the locale file's "address" value is used.
AGENT_ADDRESS=

# Role noun used in framework prompts that describe this agent (memory
# consolidation / inbox classifier, DGN-851). Empty = generic assistant
# wording. A kit bundle overrides it with its own product wording (e.g. the
# lifekit bundle supplies its life-assistant term).
# AGENT_ROLE=

# Timezone offset in integer hours from UTC (e.g. 9 for UTC+9/KST, -5 for EST).
# Used by lifekit bundle routines (morning-brief, daily-retro) to compute
# local-day boundaries for event-window queries. Deliberately NOT set here
# (DGN-1704: a shipped 0 counted as a declared UTC clock). mint stamps the
# resolved value: crew value (<crews home>/crew.conf TZ_OFFSET_HOURS) >
# parent instance > host. Set it yourself only as a per-agent override.
# Resolver: routines/lib/tz_offset.sh.
# AGENT_TZ_OFFSET_HOURS=

# Morning-brief schedule title-prefix exclusion. Comma-separated list of
# title prefixes; a schedule event whose title (after stripping leading
# whitespace) starts with any listed prefix is omitted from the morning
# brief. Plain string prefix, no regex. Empty/missing = show all events.
BRIEF_EXCLUDE_TITLE_PREFIXES=

# Daily-retro content-experience keyword list (comma-separated). An
# appointment whose title contains any keyword triggers a specific
# impressions/review question in the retro. Empty/missing = off.
RETRO_CONTENT_TITLE_KEYWORDS=

# Daily-retro health source (DGN-389/DGN-396). Default: local (unchanged behavior).
# warg: attempt live read via Warg's lifekit.sh at retro fire time (DGN-396);
#   fall back to inbox snapshot + "HH:MM 기준" annotation on any failure.
# RETRO_HEALTH_SOURCE=local

# Path to the peer agent's lifekit.sh for live health reads (DGN-396).
# Required only when RETRO_HEALTH_SOURCE=warg. Set to the absolute path of
# the peer agent's database/lifekit.sh. Never point at a raw sqlite file.
# On failure (missing/non-zero exit/timeout) falls back to inbox snapshot.
# WARG_LIFEKIT_SH=

# STEWARD_ENV_FILE -- the steward instance's own .env (bot token / chat id),
# for routines/push.sh --audience operator routing (DGN-1585). Set to the
# absolute path of the steward instance's .telegram_bot/.env. Empty/missing/
# unreadable = unresolved: push.sh falls back to the owner channel and logs
# one stderr line (never a silent drop). This repo's push.sh --env flag
# already accepts an arbitrary .env path; this key is the config-resolved
# source for the operator audience instead of a hardcoded recipient.
# STEWARD_ENV_FILE=

# Coordinates for the morning-brief weather section (Open-Meteo, no API key).
# Both AGENT_LAT and AGENT_LNG must be set (non-empty) for the weather section
# to appear; if either is empty or missing the section is silently omitted.
# Example: Seoul = 37.5665 / 126.9780
AGENT_LAT=
AGENT_LNG=

# Morning-brief yesterday diet/workout recap gate (default: on).
# Set to "off" on instances where the diet/workout domain has been transferred
# to another agent -- local agg-day would return 0 and show a false "0" line.
# Unset/empty = on (default; recap shown when diet domain is local).
# BRIEF_DIET_RECAP=on

# Morning-brief weather image card gate (default: off).
# Set to "on" to render the weather+air-quality+quote PNG card (via
# routines/bundle/morning_brief_card.py + render venv). The card is sent as a
# photo AFTER the text brief; the text weather block is suppressed when the
# card generates successfully. Fail-open: card failure falls back to text
# weather and never aborts the brief.
# Unset/empty = off (default; text weather used unless opted in).
# BRIEF_WEATHER_CARD=off

# SLUG -- immutable handoff slug: this instance's mailbox address under
# ~/.dogany/handoff/<slug>/ (DGN-635: the address IS the rule; no registry).
# Stamped ONCE by mint.sh at mint time (DGN-635 FIX-3); the template ships
# no value on purpose -- the value is per instance. Readers (handoff
# engine.py own_slug(), routines/handoff-provision.sh) fall back to the
# instance root's basename lowercased when the key is missing. Never
# hand-edit after mint.
# SLUG=

# TICKET_FILE_GLOB -- ticket-filename glob for the done-claim gate and
# ticket lints (routines/done-claim-gate.py). Resolution: env
# TICKET_FILE_GLOB= wins -> this key -> built-in default DGN-*.md.
# Set only on instances whose worklog uses non-DGN ticket filenames.
# TICKET_FILE_GLOB=DGN-*.md

# DOGANY_UPDATE_CHANNEL -- framework update channel (DGN-593). The
# MACHINE-READ home is .instance.conf (written at install; env override
# wins) -- readers: routines/self-update.sh, the canonical repo's promote
# script, scripts/pack/update_plan.sh, scripts/pack/update_apply.sh. No framework
# code reads THIS file for it; a copy here is informational only.
# Values: release (default when unset) | dev | staging | main.
# DOGANY_UPDATE_CHANNEL=release

# KIT category (DGN-466 / DGN-783 BK-1). Machine-read dispatch key;
# config/lifekit.conf LIFEKIT= stays the within-kit
# lifecycle once a kit is chosen. Tristate lifecycle (OQ-B -- isomorphic to
# the LIFEKIT= pending lifecycle):
#   pending  the kit choice has NOT been made yet -- the onboarding gate
#            (routines/onboarding-check.py) offers the kit selection once
#            after user onboarding completes, and the chosen value is written
#            here ONLY on the user's answer. Seeded on a fresh main mint by
#            the install.sh dgn227 KIT anchor (a main is kit-eligible). This
#            is the ONLY value that triggers the kit-select offer.
#   none     decided kitless -- a domain mint (kitless by construction; the
#            anchor seeds none, never pending) or a main whose user chose
#            "no kit". Never re-offered (a decided kitless adds zero
#            onboarding questions).
#   lifekit  the life-management bundle (service/lifekit/bundle.conf) is this
#            instance's kit (chosen at the kit-select offer, or preset via
#            DOGANY_KIT at install).
#   bizkit   business-assistant bundle -- approved category, bundle NOT yet
#            shipped. Fail-closed: never offered and never written until the
#            bundle ships.
# Gating is KIT= tristate + DOGANY_AGENT_CLASS=main|domain only (DGN-590
# abolished tiers; never gate a kit decision on a tier).
# .template ships NO KIT= value line ON PURPOSE (OQ-B / FATAL-1): mint copies
# this file verbatim, and the install.sh dgn227 KIT anchor seeds by class via
# write-if-absent. A shipped KIT=none value line would make that anchor a
# no-op and freeze every fresh main at none -- the kit-select offer would
# never fire (the OQ-B circular defect). The onboarding reader treats a
# MISSING key as "none" (decided-kitless fail-safe for legacy copies that
# bypass the anchor). Do NOT add a KIT= value line here.

# LIFE_ENGINE (DGN-1238, optional pin). The life-data engine's file stem
# (database/<stem>.py|.db|.sh, config/<stem>.conf) has shipped under two
# names -- kit_life (current pack) and lifekit (original) -- and framework
# code RESOLVES the stem per instance (routines/lib/life-engine.sh /
# life_engine.py): explicit pin here first, else probe both names, else the
# kitless no-op path. Set this ONLY to override the probe (e.g. a deliberate
# custom stem or an ambiguous tree carrying both). Normal instances leave it
# unset -- the probe finds the right name on every known coordinate.
# LIFE_ENGINE=kit_life

# Session-recap injection budget (routines/session-recap.py).
# RECAP_PAIRS: number of trailing user/assistant exchange pairs from the
# previous session to inject at SessionStart. Default: 2 (4 messages).
# RECAP_CHAR_CAP: per-half character cap (first N + last N chars per message). Default: 200.
# Missing, empty, or non-integer values fall back to the defaults silently.
# RECAP_PAIRS=2
# RECAP_CHAR_CAP=200

# Subscription plan of the Claude account this instance runs on (DGN-546).
# Drives the plan-aware usage-gate thresholds (routines/usage-gate.py):
# tighter plans block heavy dispatches earlier. Allowed slugs:
#   pro | max_5x | max_20x | team_standard | team_premium | enterprise | free
# Unset/unknown -> treated as pro (conservative default).
# Set this to the correct slug after minting; leave unset to get pro thresholds.
# PLAN=pro

# Monthly API credit pool for the dispatch claude-api runtime (DGN-1963).
# The budget comes from PLAN= above: max_5x -> $100, max_20x -> $200,
# team_standard/team_premium -> API_CREDIT_SEAT_USD x API_CREDIT_SEATS
# (seats default 1); any other plan carries no credit (runtime off).
# API_CREDIT_MONTHLY_USD overrides the plan (0 = off). The lane also closes
# for the rest of the month the moment the API answers "credit balance too
# low". An Admin API key (ANTHROPIC_ADMIN_KEY_FILE, or keychain item
# dogany-anthropic-admin; Console -> Settings -> Admin keys) makes the
# console cost report the primary spend truth, refetched every 15 min;
# without one the pool runs on its own estimate and says so (DGN-1978).
# Set API_CREDIT_MONTHLY_USD only when the real credit differs from the plan.
# API_CREDIT_MONTHLY_USD=
# API_CREDIT_SEATS=1
# API_CREDIT_SEAT_USD=
# API_CREDIT_RESERVE_USD=

# Usage-gate switches (DGN-925). Both OPTIONAL; leave unset for the default
# (full gate, unchanged behavior).
#   USAGE_GATE     master on/off. off -> the whole gate is a no-op pass-through
#                  (kill switch). Accepts off/false/0/no/disabled. Default on.
#   USAGE_GATE_7D  scope of the 7d (weekly) block. The 5h window always applies
#                  to everyone.
#                    full (default) -> 7d blocks every session.
#                    auto-only      -> 7d blocks ONLY autonomous/cron sessions;
#                                      the owner-driven live session skips the
#                                      7d block (5h + the non-blocking burn-rate
#                                      hint still apply). Use when the owner is
#                                      present and the days-long 7d lockout is
#                                      just token-wasting friction -- the owner
#                                      is the approval authority. Autonomous
#                                      fan-out stays protected.
# Env USAGE_GATE / USAGE_GATE_7D / DOGANY_SESSION override these.
# USAGE_GATE=on
# USAGE_GATE_7D=full

# Reset passes in hand (DGN-1965), one line per runtime -- a USER SETTING:
# the user lists, adds and removes passes with /passes (or the button under
# /usage); the agent may offer to register a pass the user mentions and writes
# only after the user confirms (routines/lib/reset_passes.py add/remove).
# Do not hand-edit. Format '<count>|<expiry1>:<kind1>,<expiry2>:<kind2>,...',
# one entry per pass. Expiry: YYYY-MM-DD (valid through that day),
# YYYY-MM-DDTHH:MM (local, exact) or 'unknown'. Kind = what THAT pass
# restores: full (the 5-hour and the weekly limit), 5h, weekly, or unknown
# (planned as weekly). Older forms still read, kind unknown: '<count>|<e1>,..',
# '<count>|<date>' (all passes share the date) and '<count>|' (none
# confirmed). The dispatch selector (routines/lib/reset_passes.py) plans the
# soonest-expiring pass first, per window it covers: a pass in hand makes
# that window refillable (spend toward 100%, no reserve), a nearly full
# window gets ONE "redeem and run again" line, a pass expiring soon with the
# window unspent raises dispatch concurrency. Nothing ever redeems a pass.
# Unset = no pass.
# Env RESET_PASSES_CLAUDE / RESET_PASSES_CODEX override these.
# RESET_PASSES_CLAUDE='1|2026-10-23:full'
# RESET_PASSES_CODEX='3|2026-10-23T05:50:full,2026-10-30T04:18:full,2026-11-07T08:43:full'

# DASHBOARD_OWNER_TERM is the owner's address term for backend/internal prompt
# text (agent-to-agent, background triggers, injected blocks -- rules/
# hot.framework.md Output). Resolution: env DOGANY_OWNER_TERM -> this key ->
# neutral fallback "형님". Written by the dogany-user-onboarding skill's
# OWNER TERM WIRING step right after the Q3 "Call the user" answer is
# confirmed -- do NOT hand-edit on a live instance whose onboarding already
# ran (re-run the identity change flow instead, section 2 of that skill).
# Empty/missing = onboarding hasn't wired it yet (or this instance predates
# the wiring) -- the fallback renders exactly like a hardcoded address, which
# is what this key exists to prevent. Landing test: routines/session-recap.py.
# DASHBOARD_OWNER_TERM=

# Pinned work-board generator (routines/status-footer.py, DGN-541) and the
# dispatch start/end owner notices (routines/dispatch-detached.sh).
# Instance display tokens; resolution: env (DOGANY_CONSOLE_BASE /
# DOGANY_LIVE_LABEL / DOGANY_SIBLING_TERM / DOGANY_BOARD_EMOJI /
# DOGANY_BOARD_TITLE / DOGANY_LIVE_SHOW_MODEL) -> these keys -> neutral
# default.
# DASHBOARD_SIBLING_TERM is the ONE term naming what a background worker IS
# on this instance's owner surfaces (empty = neutral "서브에이전트"). It
# feeds every `<term> 작업 ...` surface at once: the work-board live label
# ("<term> 작업 중") and the dispatch start/end notice titles
# ("▶️ <term> 작업 시작" / "✅ <term> 작업 완료"). Set THIS key to move all
# of them together.
# DASHBOARD_EMOJI prefixes the board title (empty = bare title; typically
# the agent's identity emoji). DASHBOARD_BOARD_TITLE overrides the board
# title text (empty = product default "작업대", DGN-851).
# DASHBOARD_LIVE_LABEL is the WHOLE live-section label phrase -- the legacy
# override unit, kept for backward compatibility and for a live-label
# wording that is not "<term> 작업 중". Where set, it beats the term-built
# default on the live label ONLY (the notice titles read the term key, which
# a phrase cannot feed); an instance that sets only this key renders its
# board exactly as before.
# DASHBOARD_CONSOLE_BASE is the console base URL for decision deep links
# (empty = items render without links; leave empty unless this instance
# runs a console).
# DASHBOARD_LIVE_ITEM_PREFIX is the per-item prefix inside the live section
# (empty = neutral default "작업"). It replaced a hardcoded English "junior:",
# which split one rendered line across two languages on the first screen an
# external user meets.
# DASHBOARD_LIVE_SHOW_MODEL=on prefixes generic live items with the model that
# runs them ("Sonnet: <작업명>", words from routines/lib/
# dispatch-model-display.tsv). Dispatched rows always name their recorded
# effective model (including their runtime marker), so no runtime is blank.
# DASHBOARD_SIBLING_TERM=
# DASHBOARD_EMOJI=
# DASHBOARD_BOARD_TITLE=
# DASHBOARD_LIVE_LABEL=
# DASHBOARD_LIVE_ITEM_PREFIX=
# DASHBOARD_LIVE_SHOW_MODEL=
# DASHBOARD_CONSOLE_BASE=

# Display-name discipline (DGN-729; enforced by the RULES "## Output"
# display-name rule + the substitution map in sot/ESTATE-TAXONOMY.md).
# Controls whether user-facing text names things by the surface the user
# meets (the messaging channel by its app name, the runtime by its product
# name) and hides internal component/process names (bridge as a category,
# canonical, reconcile, vendored, transpile, nightly-consolidate), or keeps
# raw internal terms.
#   on   staff/domain agents facing real end users (default).
#   off  canonical managers (Metal + dev-crew) who need precise internal terms.
DISPLAY_NAMES=on

# Cloud dispatch environment (DGN-1726): the claude.ai cloud environment id
# (env_...) that dispatch-detached.sh --runtime cloud creates its routines
# in. Unset -> cloud spawns are refused with this key named. Per instance;
# never hardcoded in code.
# CLOUD_ENV_ID=
# Cloud-first auto-selection window (DGN-1726): with no --runtime, a
# cloud-eligible dispatch (GitHub repo target, read-only or --repo-contained
# worktree, no live-instance contact) goes to cloud first until this date
# (YYYY-MM-DD, inclusive). Unset -> off (DGN-1912, dec-194 gave up cloud
# dispatch; set a date only to opt in); "off" disables. Spent cloud
# credit: create .claude/.cloud-exhausted ({"expiry": "<iso8601>"}).
# CLOUD_FIRST_UNTIL=
